version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uav-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: uav_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - uav-network

networks:
  uav-network:
    name: uav-telemetry-network
    driver: bridge

volumes:
  postgres-data:
