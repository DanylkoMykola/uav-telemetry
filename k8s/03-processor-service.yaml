apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-service
  namespace: uav-telemetry
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processor-service
  template:
    metadata:
      labels:
        app: processor-service
    spec:
      containers:
      - name: processor-service
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/uav-telemetry/processor-service:latest
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: telemetry-config
              key: KAFKA_BOOTSTRAP_SERVERS
---
apiVersion: v1
kind: Service
metadata:
  name: processor-service
  namespace: uav-telemetry
spec:
  type: ClusterIP
  ports:
  - port: 8080
  selector:
    app: processor-service
